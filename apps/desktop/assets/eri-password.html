<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>ERI paroli</title>
    <style>
      :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5f9; color: #0f172a; }
      .card { width: 360px; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; box-shadow: 0 10px 30px rgba(2,8,23,.06); }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.firm { margin: 0 0 4px; font-weight: 600; font-size: 14px; }
      p.sub { margin: 0 0 16px; color: #64748b; font-size: 13px; line-height: 1.45; }
      label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 6px; }
      input { width: 100%; box-sizing: border-box; height: 38px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 9px; font-size: 14px; }
      input:focus { outline: none; border-color: #1e40af; box-shadow: 0 0 0 3px rgba(30,64,175,.15); }
      .row { display: flex; gap: 8px; margin-top: 18px; }
      button { flex: 1; height: 38px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
      button.primary { border: 0; background: #1e40af; color: #fff; }
      button.secondary { border: 1px solid #cbd5e1; background: #fff; color: #0f172a; }
      button:disabled { opacity: .6; cursor: default; }
      .err { color: #b91c1c; font-size: 13px; margin-top: 10px; min-height: 16px; }
    </style>
  </head>
  <body>
    <form class="card" id="f" novalidate>
      <h1>ERI paroli</h1>
      <p class="firm" id="firm">…</p>
      <p class="sub">Parol faqat shu kompyuterda, operatsion tizim shifri bilan saqlanadi va qayta ko'rsatilmaydi. Ilova Didox'ga kirishda uni E-IMZO oynasiga o'zi yozadi; hujjatlarni imzolamaydi.</p>
      <label for="p">ERI kaliti paroli</label>
      <input id="p" type="password" autocomplete="off" maxlength="256" />
      <div class="err" id="e" role="alert"></div>
      <div class="row">
        <button class="secondary" id="c" type="button">Bekor qilish</button>
        <button class="primary" id="b" type="submit">Saqlash</button>
      </div>
    </form>
    <script>
      const $ = (id) => document.getElementById(id)
      const err = (m) => ($('e').textContent = m)
      window.eriPassword.info().then(
        (firm) => ($('firm').textContent = firm.name ? `${firm.name} (STIR ${firm.tin})` : `STIR ${firm.tin}`),
        () => ($('firm').textContent = ''),
      )
      $('p').focus()
      $('c').addEventListener('click', () => window.eriPassword.close())
      $('f').addEventListener('submit', async (ev) => {
        ev.preventDefault()
        const password = $('p').value
        if (!password) return err('Parolni kiriting')
        $('b').disabled = true
        err('')
        try {
          const res = await window.eriPassword.save(password)
          $('p').value = ''
          if (res && res.ok) return window.eriPassword.close()
          err((res && res.message) || "Parolni saqlab bo'lmadi")
        } catch {
          $('p').value = ''
          err("Parolni saqlab bo'lmadi")
        }
        $('b').disabled = false
      })
    </script>
  </body>
</html>
