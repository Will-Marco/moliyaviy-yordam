appId: uz.moliyaviyyordam.desktop
productName: Moliyaviy yordam
directories:
  output: dist-app
asar: true
asarUnpack:
  - "**/*.node"
files:
  - "dist/**/*"
  - "assets/**/*"
  - "package.json"
extraResources:
  - from: ".resources/api"
    to: "api"
  - from: ".resources/web"
    to: "web"
  - from: ".resources/migrations"
    to: "migrations"
mac:
  identity: null
  category: public.app-category.finance
  target:
    - dmg # pack:mac passes --dir for a quick unpacked build
